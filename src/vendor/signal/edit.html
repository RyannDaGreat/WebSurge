  <!--
    WebSurge: Google Analytics, the Google Fonts stylesheets and the PWA
    manifest/apple-touch-icon were here, and are removed.

    An embedded build makes no third-party requests: analytics on someone
    else's page is not ours to collect, and the two font stylesheets pulled
    Inter and Roboto Mono from fonts.googleapis.com on every load, which a
    self-hosted static site should not need a CDN for. The cost is real and
    cosmetic -- the UI falls back to the system sans-serif and monospace.

    The manifest and icons were absolute ("/manifest.webmanifest"), so under an
    embedder's subdirectory they 404 anyway, and an iframe is not installable.
  -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <meta name="theme-color" content="#272a36" />
  <script type="module" crossorigin src="./assets/main-DnOmHNYi.js"></script>
</head>
